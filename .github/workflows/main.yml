name: Claude OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-oidc:
    runs-on: ubuntu-latest
    steps:
      - name: Generate OIDC Token for Claude
        id: get-token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('claude.com');
            core.setOutput('oidc_token', token);

      - name: Verify Token Generation
        run: |
          echo "✅ OIDC Token generated successfully!"
          TOKEN="${{ steps.get-token.outputs.oidc_token }}"
          echo "Token length: ${#TOKEN}"
