name: Claude AI Test

on:
  workflow_dispatch:  # امکان اجرای دستی

permissions:
  id-token: write
  contents: read

jobs:
  test-claude:
    runs-on: ubuntu-latest
    
    steps:
      - name: Get OIDC Token
        id: get-token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('claude.com')
            core.setOutput('oidc_token', token)
      
      - name: Test Token
        run: |
          echo "✅ OIDC Token generated successfully!"
          echo "Token length: ${#${{ steps.get-token.outputs.oidc_token }}}"
